[project]
name = "agent-observability"
version = "0.1.0"
description = "AI Agent framework with OpenTelemetry integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "agent-framework-orchestrations",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
