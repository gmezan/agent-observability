[project]
name = "judge"
version = "1.0.0"
description = "Self-hosted LLM-as-a-judge: OTLP trace receiver in, gen_ai.evaluation traces out"
requires-python = ">=3.11"
dependencies = [
    # HTTP surface. The OTLP/HTTP receiver is one POST route on this app --
    # there is no "OTLP server" library, only the protobuf schema below.
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic-settings==2.15.0",
    # The OTLP wire format, so the collector's exports can be decoded. Pinned
    # to the same release train as the SDK below; they are versioned together.
    "opentelemetry-proto==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    # Used for two things: configure_otel_providers(), so the judge is wired
    # exactly like the agents it grades, and OpenAIChatClient for JUDGE_MODE=llm.
    "agent-framework-core==1.19.0",
    "agent-framework-openai==1.14.4",
    # Same ceiling as the agents: httpx 2.x drops the AsyncClient API the
    # OpenAI SDK still builds against.
    "httpx>=0.28.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge"]
